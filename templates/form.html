<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BMI & Health Metrics Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom right, #fff5cc, #d0f0c0);
            display: flex;
            justify-content: center;
            padding: 24px 12px;
        }

        .form-container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            width: 420px;
            max-width: 100%;
        }

        h2 { margin-bottom: 6px; color: #333; text-align: center; }
        .sub { text-align: center; color: #666; margin-top: 0; }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover { background-color: #1e7e34; }
        .links { text-align: center; margin-top: 16px; }
        .links a { color: #1e7e34; font-weight: bold; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>💪 BMI &amp; Health Metrics</h2>
        <p class="sub">BMI · BMR · TDEE · Body-fat % · Calorie target</p>
        {% if error %}
        <p style="color:#c0392b; font-weight:bold;">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <label for="name">Your Name</label>
            <input type="text" name="name" id="name" required>

            <div class="row">
                <div>
                    <label for="age">Age (years)</label>
                    <input type="number" name="age" id="age" min="5" max="120" required>
                </div>
                <div>
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender" required>
                        <option value="" disabled selected>Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="weight">Weight</label>
                    <input type="number" name="weight" id="weight" step="0.01" required>
                </div>
                <div>
                    <label for="weight_unit">Unit</label>
                    <select name="weight_unit" id="weight_unit">
                        <option value="kg" selected>kg</option>
                        <option value="lb">pounds (lb)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label for="height">Height</label>
                    <input type="number" name="height" id="height" step="0.01" placeholder="e.g. 1.70, 170 or 5" required>
                </div>
                <div>
                    <label for="height_unit">Unit</label>
                    <select name="height_unit" id="height_unit">
                        <option value="m" selected>metres</option>
                        <option value="cm">centimetres</option>
                        <option value="ft">feet + inches</option>
                    </select>
                </div>
            </div>
            <label for="height_in">Inches (only for feet + inches)</label>
            <input type="number" name="height_in" id="height_in" step="0.1" placeholder="e.g. 9 for 5 ft 9 in">

            <label for="activity">Activity Level</label>
            <select name="activity" id="activity">
                <option value="sedentary" selected>Sedentary (little or no exercise)</option>
                <option value="light">Light (exercise 1–3 days/week)</option>
                <option value="moderate">Moderate (exercise 3–5 days/week)</option>
                <option value="active">Active (hard exercise 6–7 days/week)</option>
                <option value="very_active">Very active (physical job / athlete)</option>
            </select>

            <label for="goal">Your Goal</label>
            <select name="goal" id="goal">
                <option value="lose">Lose weight</option>
                <option value="maintain" selected>Maintain weight</option>
                <option value="gain">Gain weight</option>
            </select>

            <button type="submit">Calculate My Metrics</button>
        </form>
        <p class="links"><a href="/history">📜 View Calculation History</a></p>
    </div>
</body>

</html>
